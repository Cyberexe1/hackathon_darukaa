name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    name: Ruff lint/format, pytest
    runs-on: ubuntu-latest
    env:
      # Tests run against a real Postgres+PostGIS instance provided by the
      # `services:` block below — never a production database. Every test
      # creates its own throwaway user and cleans up after itself (see
      # tests/conftest.py), so this is safe to run repeatedly in CI.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darukaa_test
      JWT_SECRET_KEY: ci-only-test-secret-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:5173
      DEBUG: "True"
      ENVIRONMENT: test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
